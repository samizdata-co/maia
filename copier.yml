_min_copier_version: "9.5"
_subdirectory: template
_templates_suffix: .jinja

project_name:
  type: str
  help: Project name
  default: "{{ _folder_name | replace('-', ' ') | replace('_', ' ') | title }}"

project_slug:
  type: str
  help: Project slug (used on GitHub)
  default: "{{ _folder_name }}"
  validator: >-
    {% if not (project_slug | regex_search('^[a-zA-Z0-9][-_a-zA-Z0-9]+$')) %}
    Use letters, numbers, hyphens and underscores only, starting with a letter or number.
    {% endif %}

project_short_description:
  type: str
  help: Short description of the project
  default: A short description of the project.

full_name:
  type: str
  help: Your full name
  default: Nicu Calcea

email:
  type: str
  help: Your email address
  default: github@nicu.md

outlet:
  type: str
  help: Outlet (its brand styles reports and charts)
  choices:
    SAMIZDATA: samizdata
    Ziarul de Gardă: zdg
    None: none
  default: samizdata

language:
  type: str
  help: Programming languages
  multiselect: true
  choices: [R, Python]
  default: []

notebook:
  type: str
  help: Notebook format
  choices: [None, Quarto, Jupyter, Observable]
  default: None

virtual_env:
  type: str
  help: Virtual environment
  choices: [None, uv]
  default: None
  when: "{{ 'Python' in language or notebook == 'Jupyter' }}"

charts:
  type: str
  help: Charts
  choices: [None, mozaic]
  default: None

chart_locales:
  type: str
  help: Chart languages, comma-separated (en, ro, ru); the first is the default
  default: "{{ 'ro' if outlet == 'zdg' else 'en' }}"
  when: "{{ charts == 'mozaic' }}"
  validator: >-
    {% for locale in chart_locales.split(',') %}{% if locale.strip() not in ['en', 'ro', 'ru'] %}
    Use en, ro and ru, separated by commas.
    {% endif %}{% endfor %}

# mozaic release the charts install from npm. Not asked; bump it after each mozaic release
# (tests/test_generation.py checks it against a sibling mozaic checkout).
mozaic_version:
  type: str
  default: "0.10.0"
  when: false

# A local mozaic checkout to link instead of npm, for developing the library from a project.
# Not asked; pass it with `--data mozaic_path=/absolute/path/to/mozaic`.
mozaic_path:
  type: str
  default: ""
  when: false
  validator: >-
    {% if mozaic_path and not mozaic_path.startswith('/') %}
    Use an absolute path to the mozaic repository.
    {% endif %}

_migrations:
  # v3 moved notebooks/ and story.md into docs/. The update replaces them with fresh template
  # copies, so put back the project's own committed versions (and any other notebooks) there.
  - version: v3.0.0
    when: "{{ _stage == 'after' }}"
    command: >-
      git ls-tree -r --name-only HEAD -- notebooks story.md | while IFS= read -r f; do
      t="docs/${f#notebooks/}"; [ "$f" = story.md ] && t=docs/story.md;
      mkdir -p "$(dirname "$t")"; git show "HEAD:$f" > "$t"; rm -f "$f";
      done; rmdir notebooks 2>/dev/null || true

_tasks:
  - command: npm install
    when: "{{ notebook == 'Observable' }}"
  - command: uv venv --allow-existing
    when: "{{ virtual_env == 'uv' }}"
  - command: uv add --dev ipykernel
    when: "{{ virtual_env == 'uv' and notebook == 'Jupyter' }}"
  - command: pnpm install --dir charts
    when: "{{ charts == 'mozaic' }}"
